<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sell Setup</title>
<link rel="stylesheet" href="cat.css">
</head>
<body>

<div class="page">

  <div class="container">

    <h1>Where would you like to sell?</h1>
    <p class="subtitle">
      Pick as many as you like — you can always change these later.
    </p>

    <div class="options">

      <label class="card">
        <div>
          <h3>An online store</h3>
          <p>Create a fully customizable website</p>
        </div>
        <input type="checkbox" checked>
      </label>

      <label class="card">
        <div>
          <h3>In person</h3>
          <p>Sell at retail stores or physical locations</p>
        </div>
        <input type="checkbox" checked>
      </label>

      <label class="card">
        <div>
          <h3>An existing website or blog</h3>
          <p>Add a Buy Button to your site</p>
        </div>
        <input type="checkbox">
      </label>

      <label class="card">
        <div>
          <h3>Social media</h3>
          <p>Reach customers on Instagram, TikTok</p>
        </div>
        <input type="checkbox">
      </label>

      <label class="card">
        <div>
          <h3>Online marketplaces</h3>
          <p>List products on Amazon, Etsy</p>
        </div>
        <input type="checkbox">
      </label>

      <label class="card">
        <div>
          <h3>I'm not sure</h3>
        </div>
        <input type="checkbox">
      </label>

    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <div class="footer-inner">
      <button class="back">Back</button>
      <button class="next">Next</button>
    </div>
  </div>

</div>

</body>
</html>
