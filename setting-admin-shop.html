<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store Settings</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Poppins',sans-serif;
  margin:0;
  background:#fff;
}

.container{
  max-width:500px;
  margin:60px auto;
  padding:20px;
}

.card{
  background:#f5f5f5;
  padding:20px;
  border-radius:14px;
  margin-bottom:20px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  background:black;
  color:white;
  border-radius:12px;
  margin-top:10px;
  cursor:pointer;
}

.delete{
  background:red;
}
</style>
</head>
<body>

<div class="container">
  <h1>Store Settings</h1>

  <div class="card">
    <h3 id="shopName"></h3>
    <p id="ownerName"></p>
  </div>

  <button onclick="goProducts()">Manage Products</button>
  <button onclick="logout()">Logout</button>
  <button class="delete" onclick="deleteShop()">Delete Shop</button>
</div>

<script>
const shopName = localStorage.getItem("shopName") || "My Store";
const username = localStorage.getItem("username") || "Owner";

document.getElementById("shopName").innerText = shopName;
document.getElementById("ownerName").innerText = "Owner: " + username;

function goProducts(){
  window.location.href = "products1.html";
}

function logout(){
  localStorage.clear();
  window.location.href = "login.html";
}

async function deleteShop(){
  const userId = localStorage.getItem("userId");

  const confirmDelete = confirm("Delete entire shop?");
  if(!confirmDelete) return;

  const response = await fetch(
    `http://localhost:5000/admin/delete-user/${userId}`,
    {
      method:"DELETE"
    }
  );

  const data = await response.json();

  alert(data.message);

  localStorage.clear();
  window.location.href = "login.html";
}
</script>

</body>
</html>
