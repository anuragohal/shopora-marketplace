<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile World</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#fff;
  color:#111;
}

/* HEADER */
.header{
  padding:20px 40px;
  border-bottom:1px solid #eee;
}

.header h1{
  font-size:32px;
}

.header p{
  color:#666;
  margin-top:6px;
}

/* MAIN LAYOUT */
.container{
  display:flex;
  height:calc(100vh - 100px);
}

/* MAP LEFT */
.map-section{
  width:40%;
  background:#f4f4f4;
  display:flex;
  align-items:center;
  justify-content:center;
  border-right:1px solid #ddd;
}

.map-section iframe{
  width:100%;
  height:100%;
  border:none;
}

/* PRODUCTS RIGHT */
.products-section{
  width:60%;
  padding:30px;
  overflow-y:auto;
}

.products-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-top:20px;
}

.product-card{
  background:#f9f9f9;
  padding:15px;
  border-radius:12px;
  text-align:center;
  transition:0.3s;
}

.product-card img{
  width:100%;
  border-radius:10px;
}

.product-card h3{
  margin:10px 0;
}

.price{
  font-weight:600;
}

.product-card:hover{
  transform:translateY(-5px);
}
</style>
</head>
<body>

<div class="header">
  <h1>Mobile World</h1>
  <p>Kolhapur | Mobile Store</p>
</div>

<div class="container">

  <!-- LEFT MAP -->
  <div class="map-section">
    <iframe 
      src="https://www.google.com/maps?q=Kolhapur&output=embed">
    </iframe>
  </div>

  <!-- RIGHT PRODUCTS -->
  <div class="products-section">
    <h2>Available Products</h2>

    <div class="products-grid">
      <div class="product-card">
        <img src="images/p1.jpg" alt="">
        <h3>Samsung S24</h3>
        <p class="price">₹74,999</p>
      </div>

      <div class="product-card">
        <img src="images/p2.jpg" alt="">
        <h3>iPhone 15</h3>
        <p class="price">₹79,999</p>
      </div>

      <div class="product-card">
        <img src="images/p3.jpg" alt="">
        <h3>OnePlus 12</h3>
        <p class="price">₹59,999</p>
      </div>
    </div>
  </div>

</div>

</body>
</html>
