<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Store Name</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Poppins', sans-serif;
  background: #fff;
  margin: 0;
}

.container {
  max-width: 400px;
  margin: 100px auto;
  text-align: center;
}

input {
  width: 100%;
  padding: 14px;
  margin-top: 20px;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 1rem;
}

button {
  margin-top: 20px;
  padding: 12px 20px;
  border: none;
  background: black;
  color: white;
  border-radius: 10px;
  cursor: pointer;
}

button:active {
  transform: scale(0.96);
}
</style>

</head>
<body>

<div class="container">
  <h1>Name your store</h1>
  <p>This will be your brand name</p>

  <!-- ✅ correct id -->
  <input type="text" id="storeName" placeholder="Enter store name">

  <!-- ✅ only one button logic -->
  <button onclick="goNext()">Continue</button>
</div>

<script>
function goNext() {
  const name = document.getElementById("storeName").value.trim();

  if (!name) {
    alert("Please enter your store name");
    return;
  }

  // ✅ save store name
  localStorage.setItem("storeName", name);

  // ✅ go to create account page
  window.location.href = "CREATE-ACCOUNT-PAGE.html";
}
</script>

</body>
</html>
