<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submission Successful</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* BOX */
.container {
  text-align: center;
  max-width: 420px;
  padding: 20px;
  animation: fadeIn 0.6s ease;
}

/* ICON */
.check {
  font-size: 70px;
  margin-bottom: 20px;
  animation: pop 0.5s ease;
}

/* HEADING */
h1 {
  font-size: 1.9rem;
  margin-bottom: 10px;
}

/* MESSAGE */
p {
  color: #555;
  line-height: 1.6;
}

/* BUTTON */
button {
  margin-top: 25px;
  padding: 12px 20px;
  border: none;
  background: black;
  color: white;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
}

/* ANIMATIONS */
@keyframes pop {
  0% { transform: scale(0.5); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
</style>

</head>
<body>

<div class="container">

  <div class="check">✅</div>

  <h1>You're All Set!</h1>

  <p>
    We are reviewing your store details.<br>
    You will be updated within <strong>48 working hours</strong>.
  </p>

  <button onclick="goDashboard()">Home</button>

</div>

<script>
  // ✅ mark store as created
  localStorage.setItem("storeCreated", "true");

  function goDashboard() {
    window.location.href = "index.html";
  }

  // 🔥 OPTIONAL: auto redirect after 3 seconds
  setTimeout(() => {
    window.location.href = "index.html";
  }, 3000);
</script>

</body>
</html>
