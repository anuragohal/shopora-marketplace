<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="products1.css">
</head>
<body>

<!-- HEADER -->
<div class="header">
  <h1>My Products</h1>
  <input type="text" id="search" placeholder="Search products..." onkeyup="searchProducts()">
</div>

<!-- FILTER -->
<div class="filter">
  <button onclick="filterCategory('all')">All</button>
  
</div>

<!-- PRODUCT GRID -->
<div class="products" id="productList"></div>

<script>
let allProducts = [];

/* =========================
   LOAD PRODUCTS
========================= */
async function loadProducts() {
  const userId = localStorage.getItem("userId");

  if (!userId) {
    document.getElementById("productList").innerHTML =
      "<p>Please login first</p>";
    return;
  }

  try {
    const response = await fetch(`http://localhost:5000/products/${userId}`);
    allProducts = await response.json();

    showProducts(allProducts);

  } catch (error) {
    console.error(error);
    document.getElementById("productList").innerHTML =
      "<p>Failed to load products</p>";
  }
}

/* =========================
   SHOW PRODUCTS
========================= */
function showProducts(products) {
  const container = document.getElementById("productList");

  if (!products || products.length === 0) {
    container.innerHTML = "<p>No products available</p>";
    return;
  }

  container.innerHTML = "";

  products.forEach((p) => {
    container.innerHTML += `
      <div class="product-card">
        <img src="${p.image || 'https://via.placeholder.com/200'}" alt="">
        <h3>${p.name}</h3>
        <p class="price">₹${p.price}</p>
        <p>${p.category}</p>
        <button onclick="deleteProduct('${p._id}')">Delete</button>
      </div>
    `;
  });
}

/* =========================
   DELETE PRODUCT
========================= */
async function deleteProduct(productId) {
  const confirmDelete = confirm("Delete this product?");

  if (!confirmDelete) return;

  try {
    const response = await fetch(
      `http://localhost:5000/delete-product/${productId}`,
      {
        method: "DELETE"
      }
    );

    const data = await response.json();

    alert(data.message);

    loadProducts(); // reload after delete

  } catch (error) {
    console.error(error);
    alert("Delete failed");
  }
}

/* =========================
   FILTER CATEGORY
========================= */
function filterCategory(category) {
  if (category === "all") {
    showProducts(allProducts);
    return;
  }

  const filtered = allProducts.filter(
    product => product.category === category
  );

  showProducts(filtered);
}

/* =========================
   SEARCH PRODUCT
========================= */
function searchProducts() {
  const searchValue = document
    .getElementById("search")
    .value
    .toLowerCase();

  const filtered = allProducts.filter(product =>
    product.name.toLowerCase().includes(searchValue)
  );

  showProducts(filtered);
}

loadProducts();
</script>

</body>
</html>
